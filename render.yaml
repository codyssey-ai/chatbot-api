# Render Blueprint
#
# 대시보드에서 직접 설정해도 되지만, 파일로 두면 설정이 저장소에 남아
# 누가 다시 배포하더라도 같은 구성이 나온다.
#
# 값이 있는 환경 변수만 여기에 적는다.
# 비밀값은 sync: false 로 두어 대시보드에서 입력한다. 저장소에 올리지 않는다.
services:
  - type: web
    name: chatbot-api
    runtime: python
    plan: free
    region: singapore          # 무료 플랜에서 한국과 가장 가까운 리전
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # --- 비밀값. 대시보드에서 입력한다 -------------------------------------
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL        # Supabase Connection Pooler 의 Session 모드(5432)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # --- 배포 환경에서 로컬과 달라지는 값 -----------------------------------
      # Render 는 HTTPS 를 제공하므로 세션 쿠키에 Secure 플래그를 켠다.
      - key: COOKIE_SECURE
        value: "true"

      # --- 기본값. 바꿀 일이 있으면 대시보드에서 덮어쓴다 ---------------------
      - key: MAIN_MODEL_PROVIDER
        value: openai
      - key: SUMMARY_MODEL_PROVIDER
        value: openai
      - key: OPENAI_MODEL_NAME
        value: gpt-4.1-mini
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      - key: OPENAI_TIMEOUT_SECONDS
        value: "18"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "20"
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      - key: SUMMARY_TRIGGER_TOKENS
        value: "8000"
      - key: SUMMARY_KEEP_TOKENS
        value: "4000"
      - key: MAX_MESSAGE_LENGTH
        value: "2000"
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: LOG_LEVEL
        value: INFO
